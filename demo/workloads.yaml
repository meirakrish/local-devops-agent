# Demo workloads for the agent: four deliberately broken deployments and one healthy one.
# Used by `pnpm demo:up` (kind) and works on any cluster:
#   kubectl apply -f demo/workloads.yaml
#   kubectl delete namespace agent-test
apiVersion: v1
kind: Namespace
metadata:
  name: agent-test
---
# CrashLoopBackOff: the app exits because a required env var is missing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: agent-test
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "starting web server v1.4.2"
              echo "loading config from environment"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set, cannot connect to database" >&2
                exit 1
              fi
              sleep 3600
---
# ImagePullBackOff: the image tag does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments }
  template:
    metadata:
      labels: { app: payments }
    spec:
      containers:
        - name: payments
          image: nginx:1.99.99-doesnotexist
---
# OOMKilled: buffers /dev/zero in memory until it exceeds a 32Mi limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          command: ["sh", "-c", "echo 'warming cache'; tail /dev/zero"]
          resources:
            requests: { memory: 16Mi }
            limits: { memory: 32Mi }
---
# Unschedulable: requests far more CPU than any node has (1000 cores, so it fails on any machine).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: batch }
  template:
    metadata:
      labels: { app: batch }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: "1000" }
---
# Healthy: shows that the agent ignores workloads that are fine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent-test
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
