# Demo workloads for the agent: five deliberately broken deployments, one healthy one,
# two broken Services and a broken admission webhook.
# Used by `pnpm demo:up` (kind) and works on any cluster:
#   kubectl apply -f demo/workloads.yaml
#   kubectl delete -f demo/workloads.yaml   (also removes the cluster-scoped webhook)
apiVersion: v1
kind: Namespace
metadata:
  name: agent-test
  labels:
    devops-agent-demo/policy: enforced
    # Rejects privileged pods, hostNetwork, hostPath etc. (see metrics-agent below).
    pod-security.kubernetes.io/enforce: baseline
---
# CrashLoopBackOff: the app exits because a required env var is missing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: agent-test
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "starting web server v1.4.2"
              echo "loading config from environment"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set, cannot connect to database" >&2
                exit 1
              fi
              sleep 3600
---
# ImagePullBackOff: the image tag does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments }
  template:
    metadata:
      labels: { app: payments }
    spec:
      containers:
        - name: payments
          image: nginx:1.99.99-doesnotexist
---
# OOMKilled: buffers /dev/zero in memory until it exceeds a 32Mi limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          command: ["sh", "-c", "echo 'warming cache'; tail /dev/zero"]
          resources:
            requests: { memory: 16Mi }
            limits: { memory: 32Mi }
---
# Unschedulable: requests far more CPU than any node has (1000 cores, so it fails on any machine).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: batch }
  template:
    metadata:
      labels: { app: batch }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: "1000" }
---
# Service in front of the crashlooping web pods: no ready endpoints, so requests fail.
# The agent groups it with the web Deployment and its pods as one problem.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: agent-test
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 8080
---
# Pod Security rejection: the namespace enforces the "baseline" level, which forbids
# hostNetwork. The ReplicaSet's pods are rejected (FailedCreate), so there are no pods to
# inspect, only the controller's events.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-agent
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: metrics-agent }
  template:
    metadata:
      labels: { app: metrics-agent }
    spec:
      hostNetwork: true
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "3600"]
---
# Healthy: shows that the agent ignores workloads that are fine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent-test
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
# Selector typo: meant for the frontend pods (app=frontend), but selects app=front-end,
# so it has no endpoints and every request to it fails.
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: agent-test
spec:
  selector: { app: front-end }
  ports:
    - port: 80
      targetPort: 80
---
# Broken admission webhook: its Service has no pods behind it, and failurePolicy=Fail
# means the API server rejects every request the webhook matches. Scoped narrowly so it
# cannot break the demo cluster itself: only creating CronJobs in namespaces labeled
# devops-agent-demo/policy=enforced (just agent-test), which nothing does on its own.
apiVersion: v1
kind: Service
metadata:
  name: policy-webhook
  namespace: agent-test
spec:
  selector: { app: policy-webhook } # no pods have this label
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: agent-demo-policy
webhooks:
  - name: cronjobs.policy.agent-demo.example.com
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        namespace: agent-test
        name: policy-webhook
        path: /validate
    namespaceSelector:
      matchLabels:
        devops-agent-demo/policy: enforced
    rules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["cronjobs"]
